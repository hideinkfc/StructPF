- id: puech2025_stratl_lawer
  type: ill-structured
  phase: generation
  topic: speed, distance, time (car braking)
  format: word_problem
  grade: 11th
  source_reference: Kapur, 2008
  problem: 'Anita was on her way to school on a beautiful mild day in November. Just as she approached an intersection, she
    noticed that the light had turned yellow and pedestrians were already starting to move across the intersection. She slammed
    on her brakes and came to a screeching halt. A large delivery truck was following closely behind Anita’s car. Anita heard
    brakes screeching behind her and then felt the truck crash into the rear of her car. The impact shoved her car into the
    intersection before it came to a stop. Luckily, she escaped serious injury, as did the driver of the truck. Not surprisingly,
    her car was badly damaged. The driver of the delivery truck came over to her and said, “Miss, are you crazy—why did you
    slam on your brakes? The light was just turning yellow! This accident is your fault!”


    Two policemen arrived on the scene to investigate the accident. The delivery truck driver ran over to the policeman and
    repeated his statements. Anita was still recovering from the incident; her chest hurt from the shoulder strap of her seatbelt,
    but other than that she felt OK.


    The policemen then interviewed some witnesses. Most of them told him that both the car and the truck were speeding and
    almost ran over some pedestrians who had started to cross the road as the light turned yellow. Others, however, felt that
    the car and truck were traveling at a normal speed for the area. After taking full statements from the witnesses, Officer
    Singh went back to the police station, and started preparing to file his report on the accident. He began by reading through
    the various statements and reports.


    **ANITA’S STATEMENT**


    I was heading to class in my car, when the light at the intersection turned yellow. I saw students starting to cross and
    so I hit my brakes, coming to a stop. I heard more screeching of brakes; then a truck crashed into the back of my car,
    dragging my car into the intersection along with it. I was traveling under the speed limit, but the driver of the truck
    must have been speeding. Did you get the truck driver’s insurance information?


    **TRUCK DRIVER’S STATEMENT**


    I had just delivered some boxes to Delhi Public School. This high school kid in an old beat-up car was in front of me—when
    all of a sudden, she slams on her brakes. So did I, but I still slammed into her. The light had just turned yellow; we
    both had time to go through the light. This is her fault!


    **REPORT SUBMITTED BY THE ACCIDENT ANALYSIS SPECIALIST**


    At the scene of the accident, there were skid marks showing that both vehicles had braked. The speedometer of the truck
    was stuck at 24 kmph, leading me to believe that the truck was traveling at least 24 kmph when it crashed into the car.


    The car was dragged 9 meters into the intersection, coming to a stop close to the northeast corner of the intersection.
    The truck was found directly behind the car leading me to believe that it had dragged the car along with it. Both vehicles
    showed straight skid marks from the south side of the intersection to the position where they came to a stop. My analysis
    of the measurements shows that the car left a 12-meter skid mark prior to being struck by the truck, while the truck left
    a 6 meter skid mark before hitting the car.


    I estimate the average deceleration on the road to be roughly 6.0 m/s2. I also noted that the speed limit on the road
    is 40 kmph. The truck weighs approximately twice the weight of the car. Since we know that the car had stopped just prior
    to being hit by the truck, the speed of the truck before impact can be estimated to be about 1.5 times the speed of the
    two vehicles just after impact.


    **Question:**


    Should Officer Singh charge either driver for speeding? If so, whom should he charge for the accident? Present your case
    as best you can.'
  canonical_solution: ''
  prior_knowledge_required: []
  expected_student_rsms: []
  critical_conceptual_features: []
- id: puech2025_stratl_lawer_structured
  type: well-structured
  phase: generation
  topic: speed, distance, time (car braking)
  format: word_problem
  grade: 11th
  source_reference: Kapur, 2008
  problem: You are driving your brand new car on a straight inner-city road when you suddenly see a goat at a distance directly
    in front of your car. You slam on the brakes right away and just about manage to avoid crashing into the goat. A traffic
    policeman comes right over and immediately gives you a speeding ticket. Still shaking from the experience, you decide
    to investigate the accident scene to see if you should fight the ticket in court. You look around for the signpost indicating
    the speed limit and find it to read 50 kmph. Looking at the skid marks left by your car, you estimate their length to
    be about 11 meters. You consult with your car’s information manual to find that the car weighs 800 kg and that the coefficient
    of friction between the car tires and road during braking is usually between 0.6 and 0.8. You estimate your own weight
    to be 75 kg and reaction time to be about 0.8 seconds. Will you fight the ticket in court? Present your case as best you
    can.
