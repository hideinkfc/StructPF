exercises:
  - id: "puech2025_consistency"
    type: "invention"
    phase: "generation"
    topic: "variance_consistency"
    name: "Consistency"
    adapted_from: "Kapur & Toh (2015)"
    grade: 9
    student_success_rate: 0.62
    design_features:
      - "Admits multiple correct but suboptimal RSMs"
      - "Students not expected to know variance/SD"
      - "Data designed so range and mean are same → forces deeper thinking"
      - "Explicit instruction to generate MULTIPLE measures"
    problem: |
      The organizers of the Premier League Federation have to decide which one
      of the three players Mike Arwen, Dave Backhand and Ivan Right should
      receive the "The Most Consistent Player for the Past 5 Years" award.

      Table 1 shows the number of goals that each striker scored between
      2019 and 2023.

      The organizers agreed to approach this decision mathematically by
      designing a measure of consistency. They decided to get your help.
      Here is what you must do:
      (1) Design as many different measures of consistency as you can.
      (2) Your measure of consistency should make use of all data points
          in the table.

      Table 1. Number of goals scored by the three players in the Premier
      League between 2019 and 2023.

      | Year | Mike Arwen | Dave Backhand | Ivan Right |
      |------|-----------|--------------|------------|
      | 2007 | 13        | 12           | 14         |
      | 2008 | 12        | 14           | 10         |
      | 2009 | 15        | 16           | 18         |
      | 2010 | 17        | 15           | 18         |
      | 2011 | 13        | 13           | 15         |
    solution: |
      The concept of variance and standard deviation is unknown to students.
      Any measure proposed by the student is acceptable as long as it can be
      justified to measure consistency. The goal is for them to construct
      their own measure of consistency and justify it based on the data.

      Example canonical solution: computing the variance for each player.

      Step 1: Compute the mean:
        Mean for Mike: (13+12+15+17+13)/5 = 14
        Mean for Dave: (12+14+16+15+13)/5 = 14
        Mean for Ivan: (14+10+18+18+15)/5 = 15

      Step 2: Compute sum of squared deviations from mean:
        Mike: (13-14)²+(12-14)²+(15-14)²+(17-14)²+(13-14)² = 1+4+1+9+1 = 16
        Dave: (12-14)²+(14-14)²+(16-14)²+(15-14)²+(13-14)² = 4+0+4+1+1 = 10
        Ivan: (14-15)²+(10-15)²+(18-15)²+(18-15)²+(15-15)² = 1+25+9+9+0 = 44

      Step 3: Divide by N to get variance:
        Mike: 16/5 = 3.2
        Dave: 10/5 = 2.0
        Ivan: 44/5 = 8.8

      Conclusion: Dave is the most consistent player (lowest variance).
    pf_score_rubric:
      - "1. Giving an intuitive definition of consistency related to variation of scores"
      - "2. Thinking about comparing scores to a baseline (central value or previous year)"
      - "3. Considering absolute differences (absolute value or squaring) since only magnitude matters"
      - "4. Thinking about aggregating all differences into a single score (summing or averaging)"
    expected_student_rsms:
      - "Range (max - min)"
      - "Mean year-to-year difference"
      - "Mean absolute deviation from mean"
      - "Count of years above/below mean"
      - "Variance or sum of squared deviations"
      - "Visual inspection / qualitative judgment"

  - id: "puech2025_country"
    type: "ill-structured"
    phase: "generation"
    topic: "apportionment"
    name: "Country"
    adapted_from: "Kerrigan (2018)"
    grade: 9
    student_success_rate: 0.62
    design_features:
      - "Open-ended with convoluted story"
      - "Single optimal solution but multiple approaches to reach it"
      - "Non-integer division creates the core difficulty"
      - "Real-world context (political representation)"
    problem: |
      A new country has recently been founded. The country is split into six
      states, call them A, B, C, D, E, and F.

      The population of state A is 1,646,000 people, the population of state B
      is 6,936,000 people, the population of state C is 154,000 people, the
      population of state D is 2,091,000 people, the population of state E is
      685,000 people, and the population of state F is 988,000 people.

      There are 250 seats available on a legislative body to govern the new
      country.

      How many seats should be assigned to each state so that each state would
      receive a fair representation?

      Show your work and justify why you think your method is correct.
    solution: |
      Assign seats proportionally to population. Since divisions are not
      integers, round down then distribute remaining seats to states with
      largest remainders.

      Total population = 1,646,000 + 6,936,000 + 154,000 + 2,091,000 +
                         685,000 + 988,000 = 12,500,000

      Standard divisor = 12,500,000 / 250 = 50,000 people per seat

      Initial quotas (rounded down):
        A: 1,646,000 / 50,000 = 32.92 → 32 seats
        B: 6,936,000 / 50,000 = 138.72 → 138 seats
        C: 154,000 / 50,000 = 3.08 → 3 seats
        D: 2,091,000 / 50,000 = 41.82 → 41 seats
        E: 685,000 / 50,000 = 13.70 → 13 seats
        F: 988,000 / 50,000 = 19.76 → 19 seats

      Total initial seats = 32 + 138 + 3 + 41 + 13 + 19 = 246
      Seats left to distribute = 250 - 246 = 4

      Remainders:
        A: 0.92, B: 0.72, C: 0.08, D: 0.82, E: 0.70, F: 0.76

      Four highest remainders: A (0.92), D (0.82), F (0.76), B (0.72)
      Give one extra seat to each.

      Final allocation:
        A: 33, B: 139, C: 3, D: 42, E: 13, F: 20
        Total: 250 ✓
    pf_score_rubric:
      - "1. Thinking about using a 'standard divisor' (seats per inhabitant)"
      - "2. Thinking about rounding down to not attribute more seats than total"
      - "3. Thinking about using remainders to distribute additional seats"
    critical_conceptual_features:
      - "Proportionality as basis for fairness"
      - "Non-integer division requires rounding strategy"
      - "Rounding down (not nearest) to avoid exceeding total"
      - "Remainder-based allocation for leftover seats"
      - "Verification that total equals 250"
