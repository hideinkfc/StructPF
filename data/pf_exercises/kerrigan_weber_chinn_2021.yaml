# Kerrigan, J., Weber, K., & Chinn, C. (2021).
# Effective collaboration in the productive failure process.
# Journal of Mathematical Behavior, 63, 100892.
# DOI: 10.1016/j.jmathb.2021.100892

metadata:
  source: "Kerrigan, Weber & Chinn (2021)"
  domain: "Mathematics"
  topic: "Fair Division"
  grade_level: "undergraduate"
  country: "USA"
  course: "Liberal Arts Mathematics (Math 103)"
  learning_environment: "Productive Failure Flipped Classroom (PFFC)"
  design_features:
    - "Tasks require elementary math operations but solutions not readily discoverable"
    - "Real-life scenarios for affective engagement"
    - "Calibrated to sweet-spot (Kapur & Bielaczyc, 2012)"
