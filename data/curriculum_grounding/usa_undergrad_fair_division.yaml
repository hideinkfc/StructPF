  # Kerrigan documents the actual course sequence; each invention task precedes its video set.
  - resource: "Divider-Chooser method (two-player fair division)"
    taught_at: "Math 103 unit, before multi-player division task"
    source: "Kerrigan dissertation course sequence; Lippman Math in Society Fair Division"
    pages: "Fair Division pp. 3-5"
    applies_to:
      - kerrigan2021_invention_1
      - puech2025_stratl_land_sharing
  - resource: "Basic division and arithmetic; concept of fair share (>= 1/n of total value)"
    taught_at: "Math 103 and prior schooling"
    source: "Kerrigan dissertation / YAML; Lippman Math in Society Fair Division"
    pages: "Fair Division pp. 1-3"
    applies_to:
      - kerrigan2021_invention_1
      - kerrigan2021_invention_2
      - puech2025_stratl_land_sharing
      - puech2025_stratl_fair_distribution
  - resource: "Lone Divider method"
    taught_at: "Math 103, unit before Sealed Bids task"
    source: "Kerrigan dissertation course sequence; Lippman Math in Society Fair Division"
    pages: "Fair Division pp. 5-7"
    applies_to:
      - kerrigan2021_invention_2
      - puech2025_stratl_fair_distribution
target_concept_first_appearance:
  concept: "Multi-player fair division with standoff resolution; apportionment with largest remainders"
  location: "Math 103, weeks 6-9 of the PF-flipped unit"
  note: "Each invention task is deliberately placed BEFORE its video tutorial set, so students attempt standoff resolution before being taught the canonical method. The dissertation's week-by-week table is the authoritative 'taught-before' record."

caveats:
  - "This grounding is course-internal: 'prior knowledge' = what Math 103 had already covered, documented by the instructor-researcher's own schedule. Strongest provenance in the set, but not generalizable to other institutions."
  - "Tannenbaum (2013) would strengthen the apportionment sequence but is not yet downloaded."
