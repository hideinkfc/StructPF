# Curriculum grounding: USA undergraduate (Rutgers Math 103) — Fair division / apportionment
# Grounds: kerrigan_weber_chinn_2021.yaml, StratL fair-division tasks
id: usa_undergrad_fair_division
country: USA
grade: "undergraduate (non-STEM, liberal arts)"
school_level: "University (Rutgers Math 103, Topics in Mathematics for the Liberal Arts)"
target_concept: "Fair division methods (Lone Divider, Sealed Bids) and apportionment (Hamilton/largest remainders)"
expert_tasks_grounded:
  - kerrigan2021_invention_1          # land division (Lone Divider)
  - kerrigan2021_invention_2          # furniture (Sealed Bids)
  - puech2025_stratl_land_sharing
  - puech2025_stratl_fair_distribution
  - puech2025_stratl_country          # apportionment
  - puech2025_stratl_fair_distrubution_time  # Ann/Bob time-sharing

sources:
  - name: "Kerrigan, J. (2018). Productive failure in the flipped mathematics classroom. Ed.D. dissertation, Rutgers University"
    url: "https://doi.org/10.7282/T3QV3QX5"
    repository_url: "https://rucore.libraries.rutgers.edu/rutgers-lib/57269/"
    access_date: "2026-08-24"
    type: author_course_documentation
    note: "The dissertation IS the curriculum record here: it documents the full Math 103 course schedule, the week-by-week invention-task sequence, and the video-tutorial set (13-15 videos between classes). This is stronger than a state curriculum because it is the actual taught sequence for these exact students."
    key_pages:
      - "PDF pp. 39-43 (numbered): learning-environment design, PFFC sequence"
      - "Appendix A (PDF p. 151): Invention Tasks #1-#4 verbatim (country/apportionment, Ann/Bob store, land, furniture)"
      - "Appendix B-D: in-class problems and posttest aligned to the taught methods"

  - name: "Tannenbaum, P. (2013). Excursions in Modern Mathematics. Pearson"
    access_date: "2026-08-24"
    type: textbook_chapter_order
    status: not_downloaded
    note: "Kerrigan's Appendix A marks Invention Task #1 (country apportionment) as 'adapted from Tannenbaum (2013)'. The textbook chapter order (apportionment, fair division, fair distribution) is the taught sequence; no local copy."

  - name: "Lippman, D. (2022). Math in Society, version 2.6 — Apportionment and Fair Division"
    file:
      - "documents/lippman_apportionment_v2_6.pdf"
      - "documents/lippman_fair_division_v2_6.pdf"
      - "documents/lippman_voting_theory_v2_6.pdf"
    url: "https://www.opentextbookstore.com/mathinsociety/"
    access_date: "2026-08-24"
    type: open_textbook
    license: "CC BY-SA 4.0"
    key_pages:
      - "Apportionment PDF pp. 1-4: problem, standard divisor, quotas, Hamilton method"
      - "Fair Division PDF pp. 1-7: fair shares, divisible goods, Divider-Chooser, Lone Divider"
      - "Fair Division PDF p. 11: Sealed Bids for discrete goods"
    note: "Open textbook chapters added to the retrieval corpus as a general U.S. liberal-arts mathematics source."

