target_concept_first_appearance:
  concept: "Standard deviation as a measure of spread"
  location: "Secondary 3/4, S1.12"
  page: "p.23"
  note: "The MOE O-Level syllabus introduces standard deviation at Sec 3/4. A Grade 9 (Sec 3) class early in the year sits exactly at the PF boundary: mean/range available, SD not yet consolidated. Kapur & Toh (2015) note students do not know variance."

caveats:
  - "MOE's 'Sec 3/4' grouping means the exact week of SD instruction is school-dependent; the paper's claim ('students not expected to know variance/SD') is the operative ground truth, the syllabus provides the structural confirmation."
