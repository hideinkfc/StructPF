[project]
name = "pf-generation"
version = "0.1.0"
description = "LLM pipeline for generating Productive Failure exercises with simulated student refinement"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "certifi>=2024.2.2",
    "tqdm>=4.65",
    "tenacity>=8.2",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "jupyter>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# N806: uppercase names such as N and P are standard mathematical notation.
# E501: long prompt strings and comments are kept as written; ruff format handles code wrapping.
ignore = ["N806", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
