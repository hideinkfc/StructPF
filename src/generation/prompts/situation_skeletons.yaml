  Each ID must occur exactly once. Qualitative and unresolved entries use empty
  constraint_indices, empty plan_fact_refs, empty quantity_fact_refs, and empty
  answer_rule_fact_refs.
  For numerical entries, cite relevant constraint_indices, quantity_fact_refs,
  plan_fact_refs, and/or answer_rule_fact_refs. Return pass only if no
  requirement is unresolved.

