PROPOSE_SKELETON_SYSTEM: |
  Design one grade-level mathematical situation for a possible Productive Failure
  exercise. Productive Failure means students may begin with a taught resource,
  but the task still leaves a meaningful need for the not-yet-taught target idea.
  It does not mean that every familiar method must fail or that every student
  must discover the target unaided.

  A situation has quantities and a question, but no story and no concrete values.
  A proposed approach is a concrete student procedure, not a resource label:
  "calculate each part's rate and average those rates" is an approach; "ratio"
  alone is not.
  When a familiar numerical move is likely to matter, state the exact operation
  and comparison students could make, not a generic misconception label.

  PUBLISHED RUBRIC (Rahimi et al., Table 1)
  Use the same scoring anchors supplied to direct generation as design guidance;
  do not score your own output or promise any student outcome.
  1. Activation of Prior Knowledge (APK)
     1 (Low): No prerequisite concepts
     2 (Moderate): Includes one prerequisite concept
     3 (High): Includes two or more prerequisite concepts
  2. Sweet Spot Calibration (SSC)
     1 (Low): Too easy or too difficult: disengagement
     2 (Moderate): Moderate challenge with some failures
     3 (High): Well-calibrated: challenging but manageable, leading to productive engagement
  3. Affective Engagement (AE)
     1 (Low): Not relatable or meaningful: fails to engage
     2 (Moderate): Somewhat engaging with relatable/realistic elements
     3 (High): Highly engaging, presented in meaningful narrative or real-world scenario
  4. Multiple Representations & Solutions (MR)
     1 (Low): Few or no representations or solution methods
     2 (Moderate): Some diversity but limited
     3 (High): Wide range of representations and solution methods; fosters creativity & collaboration
  5. Open-endedness / Ill-structuredness (OE)
     1 (Low): Simple, well-structured, single path
     2 (Moderate): Moderate complexity with limited variables
     3 (High): Highly complex, requiring integration of multiple variables and representations

  Before proposing or ruling out a situation, use this authoritative contract for
  what the later deterministic checker can actually execute. Do not add, remove,
  or silently reinterpret checker capabilities:
  {checker_contract}
  This contract constrains FUTURE numerical planning and checking. At proposal
  time, do not output or require math-plan/v2 fields or frozen formulas; their
  absence is not a rejection reason. Judge whether the proposed target could
  later be represented (judge representability), not schema completeness for
  another stage.
  {skeleton_contract}

  Do not reveal the target formula, algorithm, or answer in the question, make a
  derived answer a given slot, or
  create a direct routine drill. Check whether the supplied prior knowledge already
  includes the target procedure: if familiar resources allow students to solve the
  situation directly, the task must still preserve an explainable learning opportunity
  (for example, comparing competing representations, justifying why a rule works,
  or testing boundary cases). Do not simply demand incorrect methods or obscure
  numbers to manufacture failure. A successful familiar route may remain possible
  if the task still supports comparison, explanation, or invention.
  Distinguish open-ended student demand (reasoning, comparing, inventing) from
  executable target arithmetic: do not assume students must perform the target
  algorithm or force every familiar method to fail under artificial constraints.
  Keep the executable core focused: the checker can settle one scalar, one
  largest/smallest selection across all entities, or one equality decision across
  all entities. The student-facing question can additionally ask students to
  interpret the evidence, weigh plausible approaches, or recommend what to do
  in the situation. The checked result must genuinely inform that challenge;
  do not present an unconstrained recommendation as a uniquely checked answer.
  Do not require another independent numerical answer, comparison pair, or
  sub-question that needs a second answer rule. A different display of the same
  calculation alone is not a meaningfully different approach. Each candidate
  question must give the student something to decide or interpret beyond
  verifying the checked result; "show a table or graph" is not enough. For
  example, with purchase records, ask what the records justify about a new order
  and what evidence supports that decision. This has an interpretable consequence
  without naming the target method. This is an example of form, not required
  wording or topic. Where supplied D1/prior context supports a concrete familiar
  operation, consider a candidate where that operation gives a plausible but
  incomplete starting conclusion and the target property is still needed to settle
  the stated factual question. Name the operation and why it can begin the work in
  its approach record; do not treat correct-but-insufficient knowledge as a
  misconception, assume students will use it, or force it to fail. This is an
  optional design opportunity, not a requirement that every topic use a prior
  contrast. Do not turn the task into a bare yes/no check.
  Keep the student-facing question meaningful and method-open, but scope its
  factual claim to the mathematical property the target answer_rule can settle.
  For finite input/output records, an unqualified "one rule" or "prediction rule"
  is too broad: many different function families can fit the same finite points,
  and equal-rate checking does not establish that no other rule fits. Name the
  relevant familiar contextual quantity or property and its scope, such as whether
  the same made-shots-per-attempt pace describes all listed records, then connect
  that evidence to a real decision. For a spread target, ask which data set is
  less spread out or more consistent over the observations in scope. These phrases
  specify what claim is being judged, not how to calculate it. Do not direct
  students to divide, compute a formula, or follow a target-method sequence.
  Keep the exact mathematical relationship in the teacher-facing target and
  mathematical plan/answer_rule. Do not ask whether an unspecified "constant rule"
  fits: it does not identify which property is meant and can blur additive,
  multiplicative, or other relationships. Never claim that no other rule could
  explain finite observations.
  Do not invent unsupported formulas. An equivalent bounded formulation may still
  be valid when it uses only the checker contract above; do not blanket-ban a topic
  merely because one native operation is unavailable. If the target cannot be
  represented as valid expressions, disclose that boundary rather than hiding it.
  Propose only numerical conditions essential to that learning opportunity.
  They must be mutually compatible for the quantities you actually provide.
  Conditions must fit the number of items or comparisons actually present: do not
  demand both equal and unequal outcomes on a single pair of items, and do not
  prescribe extra comparisons or scenarios not present in the situation.
  Every proposed number condition must apply to this one instance and be
  expressible by its declared quantities and the checker. Do not require a
  mixture of outcomes across different generated tasks; that is a collection
  design requirement, not a condition this plan or fill can guarantee.
  Do not claim that every row is indispensable or that every pair must be
  examined: a correct decision may follow from fewer rows. If a particular
  numerical prior contrast is central, specify an enforceable, compatible
  relationship among the actual rows and ensure some legal fill can satisfy both
  the target and prior outcomes. For a per-unit-rate versus repeated-change
  comparison, one possible three-row design has equal input increments, equal
  output increments, and rates that are not all equal. For example, inputs
  [10, 20, 30] and outputs [4, 10, 16] have equal increments (10 and 6) but
  rates 2/5, 1/2, and 8/15. This is an arithmetic illustration, not a required
  pattern: equal increments alone do not imply equal ratios, and this design is
  appropriate only when the familiar operation is relevant.
  For this particular contrast, do not require the first two rates to match and
  a later rate to differ as a default pattern; allowing unequal rates is enough
  for the target's not-all-equal decision.
  Conversely, do not combine equal input increments and equal output increments
  with a requirement that the first two rates are equal and the third differs:
  equality of the first two rates then forces the third rate to be equal too.
  Avoid that incompatible proposal rather than weakening or silently dropping a
  frozen condition. Do not impose this proportionality pattern on unrelated topics.
  If the task tests a relationship across input-output pairs, avoid making
  repeated identical inputs with different outputs the sole reason a shared
  rule fails. Specify distinct given input values when a nontrivial comparison
  is needed, with explicit pairwise inequality constraints rather than a
  qualitative promise that the fill cannot verify.
  Numerical constraints should restrict values chosen later, not restate quantity
  declarations or target definitions. Avoid vague claims such as "exact", "simple",
  or "nice" unless they are made explicit and genuinely necessary; request a
  representation condition only when it is needed and safely expressible.

  Respond ONLY with valid JSON.

PROPOSE_SKELETON_USER: |
  TARGET CONCEPT (not yet taught; this is what should actually settle the question):
  {target_concept}

  TOPIC: {topic}
  GRADE: {grade}
  SUBJECT: {subject}

  PRIOR RESOURCE CONTEXT (already taught; students may try these first):
  {prior_context}

  Propose one situation.

  Return JSON only:
  {
    "quantities": [
      { ...quantity object exactly as specified by the authoritative schema above... }
    ],
    "question": "the decision or unknown, with no numbers and no story",
    "approaches": [
     {
       "id": "snake_case_id",
       "resources": ["exact prior resource name"],
       "procedure": "the concrete steps a student might try",
       "why_plausible": "why the quantities invite this procedure",
       "anticipated_limitation": "optional: what it may not settle or explain"
     }
    ],
    "why_each_resource_can_activate": "one sentence per prior resource",
    "why_none_settles_the_question": "why this is not a direct routine drill",
    "why_the_target_is_needed": "what remains unresolved without the target",
    "number_constraints": ["plain-language design note for later planning"]
  }

REPAIR_PROPOSAL_SYSTEM: |
  Repair the proposed situation using only the original case, prior resources, and
  the parser or metadata errors below. Keep the target concept and educational
  purpose intact. Return a complete replacement proposal, not a patch.
  Use only prior resources that are explicitly supplied; do not fabricate resource
  links. Do not add concrete numbers to quantities or the question.
  {checker_contract}
  {skeleton_contract}
  Preserve valid, unaffected quantity names and metadata, including given, derived,
  and unknown quantities. If the parser or metadata errors explicitly identify a
  quantity field, correct that diagnosed field (including name, value_source,
  value_domain, or list_length) and leave other unaffected fields unchanged. Do not
  silently rename quantities, change valid metadata, or weaken requirements.
  Preserve original number_constraints as an exact ordered prefix and preserve every
  original approach id; additions require a diagnosed reason and may not weaken
  requirements.

  ORIGINAL PROPOSAL AND ERRORS:
  {proposal_feedback}

  Respond ONLY with valid JSON.

