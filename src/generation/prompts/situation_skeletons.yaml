WRITE_TASK_SYSTEM: |
  Write the student-facing exploration task for a Productive Failure lesson.
  Students will receive instruction afterward.

  Make the task understandable while leaving students responsible for developing
  and justifying their mathematical approach.

  WRITING RULES
  1. Use plain, precise language: familiar words and direct instructions appropriate
     to the students' age. Keep necessary mathematical vocabulary. Add context only
     when it helps students understand the situation; remove unnecessary formality
     and repetition, not necessary information. Briefly clarify task terms whose
     intended meaning could otherwise be unclear, without supplying a solution
     method. Use consistent names and labels throughout.
  2. Make the goal clear; leave the method open. Clearly state what students should
     produce: a decision, explanation, procedure, or measure, as specified by the
     design. Guide what to accomplish, not which mathematical steps to follow.
     Do not provide the target formula, a worked solution, or intermediate steps
     that effectively prescribe the method.
  3. Ask students to show and explain their thinking, not just give an answer.
     Use a short, direct request to show how they worked and explain why their
     approach or decision makes sense. Invite comparison of different solution
     approaches or representations only when useful for this design, not as a
     compulsory extra task.

  PUBLISHED RUBRIC (Rahimi et al., Table 1)
  Direct generation receives these same scoring anchors. Use them as design
  guidance where the fixed design supports them; do not score your output.
  1. Activation of Prior Knowledge (APK)
     1 (Low): No prerequisite concepts
     2 (Moderate): Includes one prerequisite concept
     3 (High): Includes two or more prerequisite concepts
  2. Sweet Spot Calibration (SSC)
     1 (Low): Too easy or too difficult: disengagement
     2 (Moderate): Moderate challenge with some failures
     3 (High): Well-calibrated: challenging but manageable, leading to productive engagement
  3. Affective Engagement (AE)
     1 (Low): Not relatable or meaningful: fails to engage
     2 (Moderate): Somewhat engaging with relatable/realistic elements
     3 (High): Highly engaging, presented in meaningful narrative or real-world scenario
  4. Multiple Representations & Solutions (MR)
     1 (Low): Few or no representations or solution methods
     2 (Moderate): Some diversity but limited
     3 (High): Wide range of representations and solution methods; fosters creativity & collaboration
  5. Open-endedness / Ill-structuredness (OE)
     1 (Low): Simple, well-structured, single path
     2 (Moderate): Moderate complexity with limited variables
     3 (High): Highly complex, requiring integration of multiple variables and representations

  FIXED-DESIGN SAFEGUARDS
  - Preserve the numbers, units, relationships, assumptions, scope, requested
    outputs, and intended mathematical demand. Do not invent missing facts or
    silently remove a genuinely required competing method or subquestion. A
    target method appearing in the student question is not itself a required
    student instruction; rephrase it method-open or block if its purpose cannot
    otherwise be preserved. Keep clear who or what each condition or competing
    claim applies to.
  - When the fixed question includes an interpretation or recommendation, keep
    that purpose in the student challenge, grounded in the checked mathematical
    decision. Do not replace it with a bare yes/no calculation or add a second
    numerical demand. If the fixed design only asks a factual check, do not
    invent a new recommendation to chase a rubric score.
  - Keep the student goal meaningful and method-open, while making the factual
    question no broader than the property checked by the target answer_rule. A
    generic "one rule" or "prediction rule" over finite input/output data is not
    settled by a check of one specific relationship: another function family can
    fit those same observations. Scope the decision using a familiar contextual
    quantity or property (for example, one made-shots-per-attempt pace across the
    listed records), then preserve the decision or interpretation. Do not prescribe
    the computation or reveal a target-method sequence.
  - Keep the exact target relationship in the teacher-facing target, expressions,
    and answer_rule. In student text, precise contextual units and property names
    may be needed to bound the claim; do not use them to tell students how to
    calculate. Never replace missing scope with an unqualified "constant rule", and
    never claim that no other rule could explain finite observations.
  - Helpful representation suggestions are allowed, not required. Use an
    appropriate data presentation, but do not precompute a representation that
    students are meant to construct.
  - Never require students to be wrong, use a wrong method, invent a second method,
    or list anticipated methods. Do not reveal the selected operational prior move,
    an anticipated equality, winner, or target procedure before students explore
    unless the fixed question already requires that relation.
  - Treat the target concept, design context, mathematical plan, and review as
    teacher information. Do not include teacher-facing solutions, design notes,
    anticipated approaches, the operational prior move, or review issues in the
    student-facing task. Do not announce why an anticipated student approach will fail;
    leave that discovery to students.
  - The body and question are displayed together. Use the body for the situation,
    data, and necessary conditions, and the question for the challenge and request
    for reasoning. Avoid repeating the same instructions across both fields.

  Use a target-relative disclosure test: do not reveal the target formula,
  algorithm, or a compulsory sequence of target-method steps. Necessary names of
  given quantities, units, tables, diagrams, graphs, and contextual properties
  are allowed when they bound the factual claim rather than prescribe a solution.
  For finite input/output records, do not leave "one rule" unqualified when the
  checked target tests only one relationship class; another function family can fit
  the same points. Scope the decision to a familiar contextual unit/property (for
  example, a shared made-shots-per-attempt pace over the listed records), without
  telling students how to compute it. For spread, "which data set is more
  consistent using all observations" can provide scope without naming variance.
  Do not ban ordinary words merely because they occur in the target concept; judge
  whether wording gives away a procedure or accurately bounds the checked claim.

  If essential information is missing or contradictory, report it instead of
  silently repairing the design.

  Respond ONLY with valid JSON.

WRITE_TASK_USER: |
  STUDENT CONTEXT (grade, subject, topic, and assumed prior knowledge):
  {student_context}

  TARGET CONCEPT (teacher information; do not reveal its method):
  {target_concept}

  SELECTED TASK DESIGN (question, quantities, exact numbers, and frozen plan):
  {task_design}

  FULL STRUCTURED APPROACH RECORDS (teacher context only):
  {approaches}

  INTENDED STUDENT OUTPUT:
  {intended_student_output}

  DESIGN CONTEXT (selection intention, requirements, and unresolved concerns):
  {design_context}

  Write only the student-facing task from the fixed design.

  Return JSON only. Set status to "blocked" and list the blocking issue if the
  fixed design is missing essential information or is contradictory. Otherwise
  set status to "ready" and use an empty blocking_issues list.
  {
    "status": "ready|blocked",
    "blocking_issues": ["specific issue or empty list"],
    "title": "short task title",
    "body": "the situation, exact data, and necessary conditions in clear prose or a table as appropriate",
    "question": "the student challenge and a brief request to show and explain thinking"
  }

JUDGE_SKELETONS_SYSTEM: |
  You are selecting a promising Productive Failure task structure.

  Use this authoritative checker contract before selecting a candidate. It is the
  same execution contract used later by planning, review, and filling:
  {checker_contract}
  This contract constrains FUTURE numerical planning and checking. Candidates at
  selection time are not expected to contain math-plan/v2 fields or frozen formulas;
  absence of those later-stage fields is not a rejection reason. Judge
  representability of the proposed target, not schema completeness for another stage.

  Students should be able to begin with familiar knowledge, develop meaningfully
  different approaches, and learn something relevant to the target concept by
  comparing those approaches. The task should not simply prescribe the intended
  procedure.
  Prefer a meaningful student decision or interpretation around the checkable
  core. A display choice (table versus graph) alone is not a distinct solution
  approach or an open-ended question. Reject a candidate whose only student
  demand beyond yes/no is choosing a representation or justifying the answer;
  the question must also ask what the checked result means for the situation,
  without another independent numeric answer. Judge whether a plausible familiar approach
  and the target approach can expose a useful difference without scripting
  student errors or adding unsupported calculations.

  Compare all candidates using three questions:

  1. Can students begin? Identify concrete first actions supported by the
     supplied prior knowledge. Do not assume unlisted prerequisites.
  2. Are there meaningfully different approaches? Look for plausible ways of
     examining or solving the task, not different names for the same calculation.
     Do not invent an approach merely to reach two.
  3. Is comparing the approaches educationally useful? Identify what their
     comparison could reveal and how this connects to the target concept. Avoid
     routine exercises and questions that give away the intended procedure.
     Check whether the prior knowledge already contains the target procedure:
     if familiar resources can directly solve the task, ensure the situation
     still retains a non-routine, explainable learning opportunity (e.g. comparing
     representations, evaluating efficiency, or explaining why the rule holds)
     without manufacturing failure or demanding wrong methods.

  Successful, partial, graphical, and qualitative approaches can all be valuable.
  Do not require every familiar approach to fail or produce a different numerical
  answer. Treat proposed student approaches as hypotheses, not observations.
  If the selected design genuinely depends on one tempting prior move, identify
  its exact candidate approach_id and operational calculation. Mark it numerical
  when its arithmetic paths and comparison decision can be expressed over the
  given slots and checked by the shared evaluator; the checker still does not
  validate what students infer from that arithmetic. Do not call an exact
  arithmetic comparison qualitative merely because its interpretation is
  conceptual.
  In particular, a repeated-additive-change contrast against per-unit rates is
  numerical when the candidate has at least three ordered paired rows, equal
  consecutive input steps are fixed or can be required for this design, and two
  or more adjacent output changes can be checked against the target's per-row
  rates. State the needed equal-input-step requirement when it is not already
  fixed, and include the needed equal-input-step condition in number_requirements
  so planning must encode it. The skeleton must already contain at least three
  paired rows; do not assume selection can add rows. For an equality contrast,
  select opposite expected equality outcomes only when that is the intended
  design; use the evaluator's full target and prior paths. Use qualitative only
  when the central move itself is not an exact numeric
  comparison. Use unsupported when a central numerical move cannot be represented
  or the candidate lacks enough comparisons and cannot supply them. These intents
  remain explicitly unverified when not numerically encoded, not null. If no one
  move is central, use null and do not claim in the reason or main_concern that a
  specific prior move is contrasted, successful, insufficient, or checked. A
  generic misconception label is not an operational move.
  Numerical values have not been chosen: assess proposed constraints, but do not
  claim that they have already been met. Flag missing information rather than
  assuming it.
  Before recommending a candidate, check whether its fixed number_constraints
  and your proposed number_requirements can jointly admit the selected numerical
  contrast as well as a valid target result. Do not infer equal ratios from equal
  increments: inputs [10, 20, 30] with outputs [4, 10, 16] have equal increments
  but unequal ratios. There is a distinct incompatibility when equal input and
  output increments are combined with equal first-two rates and a different
  third rate; the first two equal rates force the third equal. Reject a candidate
  with incompatible fixed conditions rather than selecting it with
  prior_contrast:null, relabeling its numerical intent qualitative/unsupported,
  or weakening its constraints. If the task is valid without a central prior
  contrast, it may still be selected with null, but its reason and main_concern
  must not claim that a particular prior operation is contrasted or needed.
  These checks apply only to a contrast the candidate/design actually relies on;
  do not force prior contrasts into otherwise valid tasks.
  Each selected numerical requirement must be enforceable for this single task.
  Do not propose or preserve a requirement that other independently generated
  tasks must have a different outcome; cross-task balance must be assessed
  across the finished collection, not by this checker. Reject a candidate
  requiring cross-task balance rather than passing it to an unrepresentable plan.
  Do not turn "use all rows" or "no subset can settle the answer" into a
  numerical requirement; a counterexample in two rows may legitimately settle
  a no answer. Require only concrete restrictions on values needed for the task.
  For a relationship across input-output pairs, repeated identical inputs
  with differing outputs can make the decision immediate without comparing
  rates. Prefer candidates that avoid such a shortcut when it undercuts the
  learning opportunity, and ensure any distinct-input requirement is actually
  expressible for this instance.

  For the selected candidate, state the numerical conditions needed to support the
  learning opportunity you identified. For each condition, give its educational
  purpose. Preserve the candidate's existing constraints. Identify additional
  conditions as proposals; keep only essential, mutually compatible conditions
  and flag conflicts rather than silently changing the task. Do not impose an
  arbitrary count cap.
  Keep number requirements strictly essential: do not duplicate declared metadata
  facts (units, list lengths, positive domains) or candidate number constraints as
  new requirements. Avoid vague, non-operational numeric thresholds such as
  "difference large enough to matter" or "numbers must be manageable". If a numeric
  margin is essential to the learning opportunity, state a precise, defensible
  relative bound at the design stage; otherwise, keep such pedagogical desires
  as qualitative notes in main_concern, not mandatory numeric requirements. Never
  relabel actual numeric conditions qualitative or retroactively alter the
  candidate's existing design. Ensure the candidate's core decision resolves to
  either a single scalar, a single largest/smallest comparison across all entities,
  or an equality check across all entities, without requiring multiple independent
  answer rules.
  Keep conditions compatible with the actual number of items and comparisons:
  do not demand both equal and unequal relationships on a single pair, and assess
  whether extensive equality constraints (such as simultaneously matching ranges,
  medians, and quartiles) introduce unnecessary complexity beyond what is needed
  to prevent an obvious shortcut. Ensure conditions are essential to the
  comparison and do not create universal failure pressure.

  A prior move is central when the selection reason, main_concern, or a number
  requirement depends on that move contrasting with, settling, or failing to
  settle the target. If central, prior_contrast must be an object naming its exact
  candidate approach_id and operational move; classify it as numerical,
  qualitative, or unsupported. Numerical means its arithmetic paths and comparison
  decision can be expressed over the given slots and checked by the shared
  evaluator; the checker still does not validate what students infer from that
  arithmetic. Do not call an exact arithmetic comparison qualitative merely
  because its interpretation is conceptual.
  In particular, a repeated-additive-change contrast against per-unit rates is
  numerical when the candidate has at least three ordered paired rows, equal
  consecutive input steps are fixed or can be required for this design, and two
  or more adjacent output changes can be checked against the target's per-row
  rates. State the needed equal-input-step requirement when it is not already
  fixed. For an equality contrast, select opposite expected equality outcomes only
  when that is the intended design; use the evaluator's full target and prior
  paths. Use qualitative only when the central move itself is not an exact numeric
  comparison. Use unsupported when a central numerical move cannot be represented
  or the candidate lacks enough comparisons and cannot supply them. These intents
  remain explicitly unverified when not numerically encoded, not null. If no one
  move is central, use null and do not claim in the reason or main_concern that a
  specific prior move is contrasted, successful, insufficient, or checked. A
  generic misconception label is not an operational move.
  For a selected numerical move that contrasts equality decisions, set
  expected_target_equal and expected_prior_equal: true means all listed target
  results or prior results are equal, false means they are not. Set both to null
  unless this equality contrast is central; when central, choose opposite values
  to state which result should be equal and which should not. Do not assume the
  target must be false or the prior must be true.

  Do not generate values or formulas. Do not require numerical disagreement or
  failure unless the learning opportunity needs it.

  Recommend the candidate with the clearest supported learning opportunity, not
  the longest list of approaches. If none qualifies, recommend none.

  Respond ONLY with valid JSON.

