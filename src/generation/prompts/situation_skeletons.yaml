REPAIR_SELECTED_SYSTEM: |
  Repair the selected situation and its mathematical plan together.
  This is one bounded upstream design correction, not a new selection.
  Preserve the target concept, original selected approaches, prior resources,
  and every original requirement. A revised question or quantity is allowed
  only to resolve the diagnosed issue below, and the response must include the
  complete revised skeleton and complete math-plan/v2. Do not weaken or delete
  requirements, turn a numeric requirement into a tautology, or add hints that
  force the target method. Revised approaches must remain genuinely distinct
  plausible student approaches.
  {checker_contract}
  {skeleton_contract}
  The revised skeleton must preserve every original quantity name (given, derived,
  and unknown), each original value_source and value_domain, and every non-null
  fixed list_length. Only the diagnosed repair may add a quantity; never remove or
  relabel one. Preserve the original number_constraints as an exact ordered prefix
  and preserve every original approach id. The checker binds only given quantities;
  derived and unknown quantities remain descriptive skeleton declarations.
  The math_plan must be a complete math-plan/v2 object with target, answer_rule,
  and a constraints list; it must not contain priors or required_checks.
  Preserve the selected prior_contrast intent. If it is numerical, include a
  formula-bearing prior_contrast for that exact approach; do not replace or
  silently drop it. A qualitative or unsupported contrast stays unverified.

  ORIGINAL SELECTED DESIGN:
  {original_design}

  ORIGINAL MATHEMATICAL PLAN:
  {original_math_plan}

  REVIEW DIAGNOSIS AND ERRORS:
  {repair_diagnosis}

  Return JSON only with:
  {
    "skeleton": { ...complete slot-only skeleton using the authoritative schema... },
    "math_plan": {
      "schema_version": "math-plan/v2",
      "quantities": [{ ...quantity objects... }],
      "target": {"name": "...", "unit": "...", "expressions": {"label": "..."}},
      "answer_rule": {"kind": "largest|smallest|equal|scalar", "labels": ["..."],
                      "unit": "...", "require_unique": true},
      "constraints": [{"left": "...", "operator": "==|!=|>|>=|<|<=",
                       "right": "...", "description": "..."}],
      "prior_contrast": null
    }
  Use null unless the original selection designated a numerical prior_contrast.
  If it did, preserve that exact approach_id and formulas that implement its
  operational move; the checker will reject a matching target decision.
  }

REPAIR_SELECTED_USER: |
  Repair the selected design for target concept {target_concept}.

  CASE:
  {case_context}

  ASSUMED PRIOR RESOURCE CONTEXT (immutable):
  {prior_context}

  ORIGINAL SELECTED DESIGN:
  {original_design}

  ORIGINAL MATHEMATICAL PLAN:
  {original_math_plan}

  DIAGNOSIS TO RESOLVE:
  {repair_diagnosis}

  Return a complete replacement skeleton and math plan. Use only the supplied
  prior resource names in approach.resources. Return JSON only.

PLAN_SKELETON_SYSTEM: |
  Freeze the mathematical plan for an already designed situation. This is a
  semantic contract, not a number search. Do not provide values.

  Use the following authoritative checker contract. It is shared with proposal,
  selection, review, and filling; do not maintain a divergent operation list:
  {checker_contract}

  Use only exact given quantity names as expression inputs. Derived and unknown
  quantities are not input slots. The new math-plan/v2 contract contains the
  executable target, answer_rule, and essential numerical constraints, plus an
  optional single prior_contrast when selection explicitly identifies a central
  numerical prior move as checkable. Do not include general priors or
  required_checks in v2. Student approaches remain plain-language hypotheses.

  The answer rule must describe how the question is answered:
    - largest or smallest: compare exactly the listed labels;
    - equal: decide whether all listed labels are equal;
    - scalar: compute the one listed result.
  The labels in the answer rule must match exactly the full set of labels declared
  in target.expressions. For scalar rules, target.expressions must contain exactly
  one formula label. You cannot repair a mismatch by dropping parts or labels of
  the fixed selected question.
  Generate math-plan/v2 only. Approaches stay in the selected situation as
  plain-language hypotheses. If DESIGN CONTEXT has a numerical prior_contrast,
  encode only that selected move as prior_contrast with its approach_id. For a
  largest/smallest target, use exact same-label formulas and a unique target
  answer; the checker rejects a matching prior decision, while a prior tie differs.
  For an equal target, target and prior paths each need at least two numeric
  expressions; their labels may differ (for example, three unit rates versus two
  consecutive changes). Copy expected_target_equal and expected_prior_equal from
  the selected design; these booleans must be opposite and exact arithmetic must
  verify both. Do not reduce either path to one derived scalar or check only one
  pair. Do not invent formulas for prose or drawings. Qualitative/unsupported
  moves stay explicitly unverified. The checker verifies arithmetic and declared
  outcomes, not semantic alignment between formula and prose. Do not add a
  contrast for unrelated or merely possible approaches.
  For a selected repeated-additive-change contrast against per-unit rates, with at
  least three paired rows, calculate a target rate for each row and at least two
  adjacent output changes. If the meaning depends on comparing changes over equal
  input intervals, preserve that requirement as an exact constraint (for example,
  input[1]-input[0] == input[2]-input[1]); do not omit it or replace it with a
  qualitative note. The arithmetic paths can be numerically checked even though
  the interpretation of their difference remains a student/reviewer judgment.
  If the selected move is qualitative or unsupported, return prior_contrast as
  null. A numerical prior_contrast supports largest/smallest or equal answer rules;
  equality outcomes are mandatory only for the equal-rule design that selected them.
  Treat judge number requirements as proposed conditions for the later fill.
  Preserve every compatible numerical requirement as a constraint; do not add an
  unresolved field to v2 or silently replace or weaken a requirement. Essential
  constraints may use formulas needed to enforce the design, even when those
  formulas are not student approaches (for example, target != an ordinary mean).
  Do not invent executable formulas for drawings, explanations, or competing
  approaches that are not the target calculation. Unknown or unsupported target
  mathematics must remain explicit and block the plan.

  Respond ONLY with valid JSON.

