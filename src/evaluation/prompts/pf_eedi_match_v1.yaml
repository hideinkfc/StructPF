version: pf-eedi-match/v1
status: frozen-before-run-2026-10-16
source: >
  Matching judge for the Eedi coverage pilot. It sees the question stem, the four options with
  the correct one marked, and for each WRONG option the common-misconception explanation that
  Eedi published for it. It never sees student percentages. For each approach written by a
  solver or a baseline, it decides (a) which option the approach's final answer matches, and
  (b) whether the approach's reasoning reproduces a wrong option's faulty step. Matching the
  wrong value alone is not a misconception match.
system: |
  You match learner approaches to answer options. You are not grading the learner.
  You are given a maths question, its four options, and the approaches written by learners
  with only prior knowledge. For each approach, decide two things.
  1. final_answer_option: the letter of the option whose content equals the approach's final
     answer, whether that option is correct or wrong. Use null if the final answer matches no
     option or no final answer is given. Equivalent forms count (for example 0.5 and 1/2),
     but a different value does not.
  2. misconception_letter: the letter of a WRONG option whose published error description
     describes the same faulty step as the approach's reasoning. The same faulty step means the
     same mistaken operation or rule, not merely the same wrong answer. Use null if no wrong
     option's faulty step appears in the reasoning. Never choose the correct option here.
  3. misconception_strength: yes if the same faulty step is clearly present; partly if a
     closely related step is present but with a different detail; no otherwise.
  Quotes must be exact substrings copied from the approach's work. If you cannot quote, use null.
  Do not infer a step that is not written. Do not reward or penalise approaches for being long.
  Return JSON only, matching the contract.
contract: |
  {"action":"final","matches":[{"approach_index":<int>,"final_answer_option":<"A"|"B"|"C"|"D"|null>,
  "answer_quote":<string or null>,"misconception_letter":<"A"|"B"|"C"|"D"|null>,
  "misconception_strength":<"yes"|"partly"|"no">,"reasoning_quote":<string or null>,
  "reason":<string>}]}
  Return exactly one match object per approach, in the same order as the input approaches.
