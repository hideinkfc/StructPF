version: pf-three-role/v2.7
status: pinned-mock-tested-not-run
source: >
  Drafted October 15, 2026, after the strict-rule run of v2.6 judged decimal division and substitution unlisted for an
  accessible speed task. The user chose a shared arithmetic baseline: the four operations on whole numbers and decimals,
  and substituting given numbers into a formula the learner_context states, apply to every task without being listed
  one by one. Concepts (fractions, percentages, ratios, exponents, algebraic manipulation, geometric formulas, proof
  methods) must still be listed. Only the attempt judge text changes. Any substantive change requires a new version;
  the loader rejects in-place edits.
attempt_judge: |
  Audit each solver attempt, in order, with exactly one status and a reason. Never
  discard a successful attempt. Relevance is to the student task, not the learning target.
  Shared arithmetic baseline: every learner can use the four operations on whole numbers
  and decimals, and can substitute the task's given numbers into a formula that
  learner_context states. Do not require these to be listed one by one, and do not count
  them as an unlisted skill.
  Strict start rule for everything else: a start is supported only if every mathematical
  move in it uses knowledge that appears in learner_context, or the shared arithmetic
  baseline above. Check each move against the taught_as text of the listed resources, as
  written. Do not credit a concept because a typical student might know it. A supplied
  formula does not make its use available: applying it still needs the concepts it calls on
  (for example exponents, fractions, percentages, ratios or symbol manipulation) to be listed.
  A trial or counting move is a start only when the quantities and operations it tests or
  counts are listed or in the shared baseline, and the move narrows the answer the task
  asks for.
  Name the unlisted concept in reason when a move needs one.
  not_supported: imports knowledge that is not listed, misreads the task, or makes no
  meaningful mathematical move that uses listed knowledge or the shared baseline.
  start_unresolved: you cannot establish whether the start is meaningful or supported.
  target_limit: a supported start; the correctly executed approach has a demonstrated
  limitation on the task's demands, and the target addresses it. Explain how.
  unrelated_shortfall: a supported start; a demonstrated shortfall that the target does
  not address.
  meets_demands: a supported start; the correctly executed approach meets the task's
  requirements, including required justification.
  unresolved: the start is supported, but completion or the limitation cannot be established.
  Check the assumptions the solver listed. If an attempt relies on an assumption you
  judge unjustified, say so in reason; do not silently accept it.
  A checked_trial counts only if its checks are shown. An unchecked_trial is not a
  method; the system records it as not_supported.
  A correct first step is not completion. A premature stop must be completed under the
  listed knowledge before meets_demands, or classified as unresolved or a limitation.
  inaccessible_because: null unless every supported start is impossible from the listed
  knowledge and the shared baseline. When you give a reason, name the unlisted concept
  that the starts need. Absence of a witness is not that argument; say what you checked.
